<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <!-- Main stylesheet -->
    <link rel="stylesheet" href="./styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCENEO | The Cinematic Vault</title>
</head>

<body>


    <!-- NAVIGATION -->
    <header class="site-header">
        <nav class="nav">

            <!-- LOGO -->
            <a href="index.html" class="logo">
                <span class="logo__name">
                    SCENEO<span class="purple">.</span>
                </span>
                <small class="logo__subtitle">
                    THE CINEMATIC VAULT
                </small>
            </a>

            <!-- NAVIGATION LINKS -->
            <div class="nav__links">
                <a href="#discover" class="nav__link">
                    Discover
                </a>
            </div>

        </nav>
    </header>



    <!-- =========================================
     MAIN CONTENT
     ========================================= -->
    <main>

        <!-- =========================================
         HERO SECTION
         Introduces SCENEO and its purpose.
         ========================================= -->
        <section class="hero">
            <div class="container">

                <!-- Hero introduction -->
                <div class="hero__content">

                    <p class="hero__label">
                        WELCOME TO SCENEO
                    </p>

                    <!-- Main headline -->
                    <h1 class="hero__title">
                        Every story deserves a
                        <span class="purple">spotlight.</span>
                    </h1>

                    <!-- Supporting description -->
                    <p class="hero__description">
                        Discover extraordinary films, explore timeless
                        stories, and find your next favorite movie.
                    </p>


                    <!-- =========================================
                      MOVIE SEARCH
                      Allows users to search the OMDb database.
                      JavaScript will handle the form submission.
                      ========================================= -->
                    <form class="search" id="search-form">

                        <!-- Movie or TV show title -->
                        <input type="search" class="search__input" id="search-input" name="search"
                            placeholder="Search movies or TV shows..." aria-label="Search movies or TV shows" required>

                        <!-- Submit search request -->
                        <button type="submit" class="search__button">
                            Search
                        </button>

                    </form>


                </div>

            </div>
        </section>


        <!-- =========================================
          DISCOVER SECTION
          Displays movie results fetched from OMDb.
          ========================================
         -->
        <section id="discover" class="discover">
            <div class="container">

                <!-- Section heading and future filter controls -->
                <div class="discover__header">

                    <h2 class="discover__title">
                        Explore <span class="purple">Movies</span>
                    </h2>


                    <!-- =========================================
                      MOVIE FILTERS
                      Allows users to filter and sort search results.
                      ========================================= -->
                    <div class="discover__filters">

                        <!-- Filter results by content type -->
                        <select id="type-filter" class="filter__select" aria-label="Filter by content type">
                            <option value="">All Types</option>
                            <option value="movie">Movies</option>
                            <option value="series">TV Series</option>
                        </select>

                        <!-- Sort displayed movies by title or release year -->
                        <select id="sort-filter" class="filter__select" aria-label="Sort search results">
                            <option value="">Sort By</option>
                            <option value="az">Title: A to Z</option>
                            <option value="za">Title: Z to A</option>
                            <option value="newest" selected>Newest First</option>
                            <option value="oldest">Oldest First</option>
                        </select>

                    </div>


                </div>

                <!-- Search results and application messages -->
                <p id="status-message" class="status-message" role="status">
                    Search for a movie to start exploring.
                </p>


                <!-- =========================================
                   MOVIE LOADING INDICATOR
                   Displays while fetching data from OMDb.
                   ========================================= -->
                <div id="loading" class="loading" role="status" hidden>

                    <!-- Animated loading spinner -->
                    <span class="loading__spinner" aria-hidden="true"></span>

                    <!-- Loading message -->
                    <p class="loading__text">
                        Finding your next favorite movie...
                    </p>

                </div>


                <!-- Movie cards will be generated here by JavaScript -->
                <div id="movies-container" class="movies">
                </div>



                <!-- =========================================
                   MOVIE PAGINATION
                   Allows users to navigate between
                   pages of OMDb search results.
                 ========================================= -->
                <nav class="pagination" id="pagination" aria-label="Movie results pages" hidden>

                    <!-- Navigate to the previous results page -->
                    <button class="pagination__button" id="prev-page" type="button">
                        ← Previous
                    </button>

                    <!-- Display the current page and total pages -->
                    <span class="pagination__info" id="page-info" aria-live="polite">
                        Page 1 of 1
                    </span>

                    <!-- Navigate to the next results page -->
                    <button class="pagination__button" id="next-page" type="button">
                        Next →
                    </button>

                </nav>



            </div>
        </section>


    </main>








    <!-- Main application JavaScript -->
    <script src="./script.js" defer></script>

</body>

</html>
